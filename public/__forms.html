<!doctype html>
<!--
  Static form stub for Netlify Forms build-time detection. The real form
  is rendered client-side by src/components/islands/ContactForm.tsx, so
  Netlify's HTML scanner cannot see it in prerendered output. This file
  registers the "contact" form with Netlify so submissions are accepted.

  Field names here MUST stay in sync with the React form.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Netlify form stub</title></head>
<body>
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
    <input type="text" name="Name" />
    <input type="email" name="Email" />
    <input type="tel" name="Phone" />
    <input type="text" name="Country" />
    <input type="text" name="Company" />
    <input type="text" name="how-hear" />
    <textarea name="Use-Case"></textarea>
    <input type="text" name="utm_source" />
    <input type="text" name="utm_medium" />
    <input type="text" name="utm_campaign" />
    <input type="text" name="topic" />
    <input type="text" name="page" />
    <input type="text" name="locale" />
    <input type="text" name="source" />
    <input type="text" name="website" />
  </form>

  <!--
    /help-desk SaaS support form, migrated from the Notion "Authgear Help Desk"
    form. Field names are short and locale-neutral; they map to the Notion
    columns as follows:

      purpose             → What is the purpose of your enquiry?
      project-name        → What is your Authgear project name?
      company             → What is your company name?
      company-website     → What is the website of your company?
      project-description → Please describe your project
      target-users        → Where are your target users based in?
      name                → What is your name?
      email               → What is your email address?
      phone               → What is your phone number?
      notes               → Is there other things regarding your enquiry we should know about?

    `purpose` is a single choice and arrives as the option's label, not its
    slug. Keep in sync with src/components/islands/HelpDeskForm.tsx.
  -->
  <form name="help-desk" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
    <input type="text" name="purpose" />
    <input type="text" name="project-name" />
    <input type="text" name="company" />
    <input type="url" name="company-website" />
    <textarea name="project-description"></textarea>
    <input type="text" name="target-users" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="notes"></textarea>
    <input type="text" name="utm_source" />
    <input type="text" name="utm_medium" />
    <input type="text" name="utm_campaign" />
    <input type="text" name="page" />
    <input type="text" name="locale" />
    <input type="text" name="source" />
    <input type="text" name="website" />
  </form>

  <!-- /success-stories-download lead-magnet form. Single email field. -->
  <form name="success-stories-download" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
    <input type="email" name="Email" />
    <input type="text" name="locale" />
    <input type="text" name="page" />
    <input type="text" name="source" />
    <input type="text" name="website" />
  </form>
</body>
</html>
